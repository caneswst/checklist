<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 待辦助手 (智譜 AI)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', 'PingFang TC', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { max-width: 720px; width: 100%; background: #ffffff; border-radius: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); padding: 32px 28px; }
        h1 { font-size: 26px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        h1 small { font-size: 14px; font-weight: 400; color: #94a3b8; margin-left: auto; }
        .subtitle { color: #64748b; font-size: 15px; border-left: 4px solid #818cf8; padding-left: 14px; margin-bottom: 28px; line-height: 1.5; }
        .input-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
        .input-row { display: flex; gap: 12px; }
        .input-row input { flex: 1; padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 16px; outline: none; transition: border 0.2s, box-shadow 0.2s; background: #f8fafc; }
        .input-row input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(129,140,248,0.15); background: #ffffff; }
        .input-row input::placeholder { color: #94a3b8; }
        .btn { padding: 14px 28px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .btn-primary { background: #818cf8; color: #fff; }
        .btn-primary:hover { background: #6366f1; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(129,140,248,0.35); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-success { background: #a7f3d0; color: #065f46; }
        .btn-success:hover { background: #6ee7b7; }
        .btn-danger { background: #fecaca; color: #b91c1c; }
        .btn-danger:hover { background: #fca5a5; }
        .btn-edit { background: #fef08a; color: #854d0e; }
        .btn-edit:hover { background: #fde047; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .status-bar { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #64748b; min-height: 28px; flex-wrap: wrap; }
        .status-bar .spinner { display: none; width: 20px; height: 20px; border: 3px solid #e2e8f0; border-top: 3px solid #818cf8; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .status-bar .spinner.active { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .todo-list { margin-top: 16px; border-radius: 16px; overflow: hidden; border: 1px solid #eef2f6; }
        .todo-header { display: grid; grid-template-columns: 3fr 1.2fr 1.2fr 1fr 0.8fr 0.5fr 0.5fr; background: #f1f4f9; padding: 12px 16px; font-weight: 600; font-size: 13px; color: #475569; letter-spacing: 0.3px; border-bottom: 1px solid #e2e8f0; }
        .todo-item { display: grid; grid-template-columns: 3fr 1.2fr 1.2fr 1fr 0.8fr 0.5fr 0.5fr; padding: 14px 16px; background: #ffffff; border-bottom: 1px solid #f1f5f9; align-items: center; font-size: 15px; transition: background 0.15s; gap: 4px; }
        .todo-item:last-child { border-bottom: none; }
        .todo-item:hover { background: #fafbff; }
        .todo-item .summary { font-weight: 500; color: #0f172a; word-break: break-word; }
        .todo-item .category { font-size: 13px; background: #eef2ff; color: #4338ca; padding: 4px 12px; border-radius: 20px; display: inline-block; width: fit-content; }
        .todo-item .date, .todo-item .time { color: #334155; font-feature-settings: "tnum"; }
        .todo-item .cal-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 6px; border-radius: 8px; transition: background 0.2s; color: #0ea5e9; justify-self: center; }
        .todo-item .cal-btn:hover { background: #e0f2fe; }
        .todo-item .edit-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 6px; border-radius: 8px; transition: background 0.2s; color: #eab308; justify-self: center; }
        .todo-item .edit-btn:hover { background: #fef9c3; }
        .todo-item .delete-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; transition: color 0.2s; padding: 4px 6px; border-radius: 8px; justify-self: end; }
        .todo-item .delete-btn:hover { color: #ef4444; background: #fef2f2; }
        .todo-item .edit-input { width: 100%; padding: 4px 8px; border: 2px solid #818cf8; border-radius: 8px; font-size: 14px; background: #f8fafc; }
        .todo-item .edit-select { width: 100%; padding: 4px 8px; border: 2px solid #818cf8; border-radius: 8px; font-size: 14px; background: #f8fafc; }
        .todo-item .edit-date, .todo-item .edit-time { width: 100%; padding: 4px 8px; border: 2px solid #818cf8; border-radius: 8px; font-size: 14px; background: #f8fafc; }
        .todo-item .edit-btns { display: flex; gap: 6px; justify-content: center; }
        .todo-item .edit-btns button { padding: 4px 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .todo-item .edit-btns .save-btn { background: #a7f3d0; color: #065f46; }
        .todo-item .edit-btns .save-btn:hover { background: #6ee7b7; }
        .todo-item .edit-btns .cancel-btn { background: #fecaca; color: #b91c1c; }
        .todo-item .edit-btns .cancel-btn:hover { background: #fca5a5; }
        .empty-state { padding: 48px 20px; text-align: center; color: #94a3b8; font-size: 15px; }
        .empty-state span { font-size: 40px; display: block; margin-bottom: 12px; }
        .footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; flex-wrap: wrap; gap: 10px; }
        .count-badge { font-size: 14px; color: #64748b; }
        .count-badge strong { color: #1e293b; }
        .api-hint, .cat-hint { font-size: 13px; color: #94a3b8; margin-top: 14px; padding: 14px 18px; background: #f8fafc; border-radius: 12px; border: 1px dashed #d1d5db; line-height: 1.7; }
        .api-hint a, .cat-hint a { color: #6366f1; text-decoration: none; }
        .api-hint a:hover, .cat-hint a:hover { text-decoration: underline; }
        .api-config-row, .cat-config-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .api-config-row input[type="text"], .cat-config-row input[type="text"] { flex: 1; padding: 10px 14px; border: 2px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none; min-width: 200px; background: #ffffff; }
        .api-config-row input[type="text"]:focus, .cat-config-row input[type="text"]:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,0.2); }
        .toggle-pwd-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px 10px; border-radius: 8px; color: #64748b; transition: background 0.2s; }
        .toggle-pwd-btn:hover { background: #e2e8f0; }
        .cat-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .cat-tag { display: inline-flex; align-items: center; gap: 6px; background: #eef2ff; padding: 4px 12px 4px 16px; border-radius: 20px; font-size: 14px; color: #4338ca; }
        .cat-tag .del-cat { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; padding: 0 4px; }
        .cat-tag .del-cat:hover { color: #ef4444; }
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .input-row { flex-direction: column; }
            .todo-header { display: none; }
            .todo-item { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 16px; border-bottom: 1px solid #f1f5f9; }
            .todo-item .summary { width: 100%; font-size: 16px; margin-bottom: 4px; }
            .todo-item .category { font-size: 12px; }
            .todo-item .date, .todo-item .time { font-size: 14px; }
            .todo-item .cal-btn, .todo-item .edit-btn { margin-left: auto; font-size: 20px; }
            .todo-item .delete-btn { margin-left: 0; }
            .footer-actions { flex-direction: column; align-items: stretch; }
            .api-config-row, .cat-config-row { flex-direction: column; align-items: stretch; }
            .todo-item .edit-btns { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ 待辦助手 <small>智譜 AI</small></h1>
        <div class="subtitle">輸入一句話（支援粵語），AI 自動拆解成 事項 · 分類 · 日期 · 時間</div>

        <div class="input-area">
            <div class="input-row">
                <input type="text" id="todoInput" placeholder="例如：明天早上10點開會" autofocus />
                <button class="btn btn-primary" id="addBtn">➕ 新增</button>
            </div>
            <div class="status-bar">
                <span class="spinner" id="spinner"></span>
                <span id="statusMsg">💡 輸入待辦事項，AI 會自動判讀</span>
            </div>
        </div>

        <div class="todo-list">
            <div class="todo-header">
                <span>事項</span><span>分類</span><span>日期</span><span>時間</span>
                <span style="text-align:center;">📅</span>
                <span style="text-align:center;">✏️</span>
                <span></span>
            </div>
            <div id="todoItems">
                <div class="empty-state"><span>📋</span>還沒有待辦事項<br /><span style="font-size:14px;color:#cbd5e1;">試試在上方輸入一句話</span></div>
            </div>
        </div>

        <div class="footer-actions">
            <span class="count-badge">共 <strong id="todoCount">0</strong> 項</span>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-success" id="exportAllBtn">📅 匯出全部</button>
                <button class="btn btn-secondary" id="clearBtn">🗑️ 清空全部</button>
                <button class="btn btn-secondary" id="demoBtn">🧪 填入範例</button>
                <button class="btn btn-secondary" id="manageCatBtn">📂 管理分類</button>
            </div>
        </div>

        <div id="catPanel" style="display:none;margin-top:14px;padding:18px 20px;background:#f1f5f9;border-radius:14px;">
            <div style="font-weight:600;font-size:14px;color:#1e293b;margin-bottom:8px;">📂 管理分類</div>
            <div class="cat-config-row">
                <input type="text" id="newCatInput" placeholder="輸入新分類名稱" />
                <button class="btn btn-primary btn-sm" id="addCatBtn">➕ 新增</button>
            </div>
            <div class="cat-list" id="catList"></div>
            <div style="font-size:12px;color:#64748b;margin-top:8px;">💡 刪除分類不會影響已使用該分類的待辦事項，僅從下拉選單中移除。</div>
        </div>

        <div class="api-hint" id="apiHint">
            🧠 目前使用 <strong>智譜 AI</strong>（金鑰已自動載入）。
            點擊「<a href="#" id="toggleApiConfig">顯示進階設定</a>」可檢視或更換金鑰。
        </div>
        <div id="apiConfig" style="display:none;margin-top:14px;padding:18px 20px;background:#f1f5f9;border-radius:14px;">
            <label style="font-weight:600;font-size:14px;color:#1e293b;display:block;margin-bottom:8px;">🔑 智譜 AI API Key</label>
            <div class="api-config-row">
                <input type="text" id="apiKeyInput" placeholder="貼上你的智譜 API Key" />
                <button class="toggle-pwd-btn" id="togglePwdBtn" title="顯示/隱藏金鑰">👁️</button>
                <button class="btn btn-primary" id="saveApiKeyBtn" style="padding:10px 20px;font-size:14px;">💾 儲存</button>
                <button class="btn btn-secondary" id="clearApiKeyBtn" style="padding:10px 20px;font-size:14px;">清除</button>
            </div>
            <div style="font-size:13px;color:#64748b;margin-top:10px;">
                可至 <a href="https://open.bigmodel.cn/" target="_blank" style="color:#6366f1;">智譜AI開放平台</a> 取得金鑰（新用戶贈送 2000 萬 Token）。
                儲存後會記錄在瀏覽器本地，不會上傳任何伺服器。
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ----- 版本控制 -----
            const APP_VERSION = '3.3';

            // ----- 狀態 -----
            let todos = [];
            let nextId = 1;
            let isProcessing = false;
            let useApi = true;
            let apiKey = '';
            let editingId = null;
            let categories = [];

            // ----- DOM 參照 -----
            const todoInput = document.getElementById('todoInput');
            const addBtn = document.getElementById('addBtn');
            const todoItems = document.getElementById('todoItems');
            const todoCount = document.getElementById('todoCount');
            const statusMsg = document.getElementById('statusMsg');
            const spinner = document.getElementById('spinner');
            const clearBtn = document.getElementById('clearBtn');
            const demoBtn = document.getElementById('demoBtn');
            const exportAllBtn = document.getElementById('exportAllBtn');
            const manageCatBtn = document.getElementById('manageCatBtn');
            const catPanel = document.getElementById('catPanel');
            const newCatInput = document.getElementById('newCatInput');
            const addCatBtn = document.getElementById('addCatBtn');
            const catList = document.getElementById('catList');
            const apiHint = document.getElementById('apiHint');
            const toggleApiConfig = document.getElementById('toggleApiConfig');
            const apiConfig = document.getElementById('apiConfig');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
            const clearApiKeyBtn = document.getElementById('clearApiKeyBtn');
            const togglePwdBtn = document.getElementById('togglePwdBtn');

            // ----- 輔助函式 -----
            function setStatus(msg, isError = false) {
                statusMsg.textContent = msg;
                statusMsg.style.color = isError ? '#b91c1c' : '#64748b';
            }
            function setLoading(loading) {
                isProcessing = loading;
                addBtn.disabled = loading;
                if (loading) spinner.classList.add('active');
                else spinner.classList.remove('active');
            }

            // ----- 分類管理 -----
            function loadCategories() {
                try {
                    const stored = localStorage.getItem('categories');
                    if (stored) categories = JSON.parse(stored);
                    else { categories = ['繳費', '會議', '其他']; saveCategories(); }
                } catch (_) { categories = ['繳費', '會議', '其他']; saveCategories(); }
            }
            function saveCategories() { try { localStorage.setItem('categories', JSON.stringify(categories)); } catch (_) {} }
            function renderCatList() {
                catList.innerHTML = '';
                categories.forEach(cat => {
                    const span = document.createElement('span');
                    span.className = 'cat-tag';
                    span.innerHTML = `${escapeHtml(cat)} <button class="del-cat" data-cat="${escapeHtml(cat)}">✕</button>`;
                    span.querySelector('.del-cat').addEventListener('click', function() {
                        const name = this.dataset.cat;
                        if (categories.length <= 1) { setStatus('⚠️ 至少保留一個分類', true); return; }
                        if (confirm(`確定要刪除分類「${name}」嗎？\n（已使用該分類的待辦事項不會被刪除）`)) {
                            categories = categories.filter(c => c !== name);
                            saveCategories();
                            renderCatList();
                            render();
                            setStatus(`✅ 已刪除分類「${name}」`);
                        }
                    });
                    catList.appendChild(span);
                });
            }

            // ----- 儲存 / 載入 -----
            function saveToLocal() {
                try { localStorage.setItem('aiTodoData', JSON.stringify({ todos, nextId, useApi, apiKey, version: APP_VERSION })); } catch (_) {}
            }
            function loadFromLocal() {
                try {
                    const raw = localStorage.getItem('aiTodoData');
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (data.version !== APP_VERSION) { localStorage.removeItem('aiTodoData'); return false; }
                    if (data.todos && Array.isArray(data.todos)) {
                        todos = data.todos; nextId = data.nextId || 1;
                        useApi = data.useApi !== undefined ? data.useApi : true;
                        apiKey = data.apiKey || '';
                        return true;
                    }
                } catch (_) {}
                return false;
            }

            // ----- 渲染 -----
            function render() {
                todoItems.innerHTML = '';
                if (todos.length === 0) {
                    todoItems.innerHTML = `<div class="empty-state"><span>📋</span>還沒有待辦事項<br /><span style="font-size:14px;color:#cbd5e1;">試試在上方輸入一句話</span></div>`;
                    todoCount.textContent = '0';
                    return;
                }
                const sorted = [...todos].sort((a, b) => b.createdAt - a.createdAt);
                for (const item of sorted) {
                    const div = document.createElement('div');
                    div.className = 'todo-item';
                    div.dataset.id = item.id;

                    if (editingId === item.id) {
                        let catOptions = '';
                        const allCats = [...categories];
                        const currentCat = item.category || '其他';
                        if (!allCats.includes(currentCat)) allCats.push(currentCat);
                        allCats.forEach(c => {
                            const selected = c === currentCat ? 'selected' : '';
                            const isDeleted = !categories.includes(c) && c === currentCat;
                            const label = isDeleted ? `⚠️ ${c} (已刪除)` : c;
                            catOptions += `<option value="${escapeHtml(c)}" ${selected} ${isDeleted ? 'style="color:#94a3b8;"' : ''}>${escapeHtml(label)}</option>`;
                        });
                        div.innerHTML = `
                            <input class="edit-input" id="edit-summary-${item.id}" value="${escapeHtml(item.summary)}" />
                            <select class="edit-select" id="edit-cat-${item.id}">${catOptions}</select>
                            <input class="edit-date" id="edit-date-${item.id}" type="date" value="${item.date || ''}" />
                            <input class="edit-time" id="edit-time-${item.id}" type="time" value="${item.time || ''}" />
                            <span></span>
                            <div class="edit-btns">
                                <button class="save-btn" data-id="${item.id}">💾 儲存</button>
                                <button class="cancel-btn" data-id="${item.id}">❌ 取消</button>
                            </div>
                            <span></span>
                        `;
                        div.querySelector('.save-btn').addEventListener('click', function(e) {
                            e.stopPropagation();
                            const id = Number(this.dataset.id);
                            saveEdit(id);
                        });
                        div.querySelector('.cancel-btn').addEventListener('click', function(e) {
                            e.stopPropagation();
                            editingId = null;
                            render();
                        });
                        const inputs = div.querySelectorAll('input, select');
                        inputs.forEach(inp => {
                            inp.addEventListener('keydown', function(e) {
                                if (e.key === 'Enter') { e.preventDefault(); saveEdit(item.id); }
                                else if (e.key === 'Escape') { e.preventDefault(); editingId = null; render(); }
                            });
                        });
                        setTimeout(() => {
                            const summaryInput = document.getElementById(`edit-summary-${item.id}`);
                            if (summaryInput) summaryInput.focus();
                        }, 50);
                    } else {
                        const cat = item.category || '其他';
                        const colors = { '繳費': '#eef2ff', '會議': '#d1fae5', '其他': '#f3f4f6' };
                        const textColors = { '繳費': '#4338ca', '會議': '#065f46', '其他': '#4b5563' };
                        const bg = colors[cat] || '#f3f4f6';
                        const tc = textColors[cat] || '#4b5563';
                        div.innerHTML = `
                            <span class="summary">${escapeHtml(item.summary || '（無標題）')}</span>
                            <span class="category" style="background:${bg};color:${tc};">${escapeHtml(cat)}</span>
                            <span class="date">${escapeHtml(item.date || '—')}</span>
                            <span class="time">${escapeHtml(item.time || '—')}</span>
                            <button class="cal-btn" data-id="${item.id}" title="加入行事曆">📅</button>
                            <button class="edit-btn" data-id="${item.id}" title="編輯">✏️</button>
                            <button class="delete-btn" data-id="${item.id}" title="刪除">✕</button>
                        `;
                        div.querySelector('.delete-btn').addEventListener('click', function() { deleteTodo(Number(this.dataset.id)); });
                        div.querySelector('.cal-btn').addEventListener('click', function() {
                            const todo = todos.find(t => t.id === Number(this.dataset.id));
                            if (todo) exportSingleTodo(todo);
                        });
                        div.querySelector('.edit-btn').addEventListener('click', function() {
                            const id = Number(this.dataset.id);
                            editingId = id;
                            render();
                        });
                    }
                    todoItems.appendChild(div);
                }
                todoCount.textContent = todos.length;
                saveToLocal();
            }

            function saveEdit(id) {
                const summaryInput = document.getElementById(`edit-summary-${id}`);
                const catSelect = document.getElementById(`edit-cat-${id}`);
                const dateInput = document.getElementById(`edit-date-${id}`);
                const timeInput = document.getElementById(`edit-time-${id}`);
                if (!summaryInput || !catSelect || !dateInput || !timeInput) return;
                const newSummary = summaryInput.value.trim() || '（無標題）';
                const newCategory = catSelect.value;
                const todo = todos.find(t => t.id === id);
                if (todo) {
                    todo.summary = newSummary;
                    todo.category = newCategory;
                    todo.date = dateInput.value;
                    todo.time = timeInput.value;
                    editingId = null;
                    render();
                    setStatus('✅ 已更新待辦事項');
                }
            }

            function escapeHtml(text) {
                if (!text) return '';
                return String(text).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));
            }

            // ----- CRUD -----
            function addTodo(summary, category, date, time) {
                const todo = { id: nextId++, summary: summary.trim() || '（無標題）', category: category || '其他', date: date || '', time: time || '', createdAt: Date.now() };
                todos.push(todo);
                render();
                return todo;
            }
            function deleteTodo(id) {
                if (editingId === id) editingId = null;
                todos = todos.filter(t => t.id !== id);
                render();
                setStatus('🗑️ 已刪除一項');
            }
            function clearAll() {
                if (!todos.length) return;
                if (confirm('確定要刪除所有待辦事項嗎？')) {
                    todos = [];
                    editingId = null;
                    render();
                    setStatus('🧹 已清空全部');
                }
            }

            // ----- 行事曆匯出 -----
            function generateIcsEvent(todo) {
                const now = new Date();
                const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
                if (todo.date) {
                    const parts = todo.date.split('-');
                    if (parts.length === 3) {
                        const [Y, M, D] = parts;
                        if (todo.time) {
                            const [H, Min] = todo.time.split(':');
                            const start = Y + M + D + 'T' + H + Min + '00';
                            let eh = parseInt(H)+1, em = Min;
                            if (eh >= 24) eh -= 24;
                            const end = Y + M + D + 'T' + String(eh).padStart(2,'0') + em + '00';
                            return { start, end, allDay: false };
                        }
                        return { start: Y+M+D, end: Y+M+D, allDay: true };
                    }
                }
                const today = y + m + d;
                return { start: today, end: today, allDay: true };
            }
            function buildIcsForTodo(todo) {
                const dt = generateIcsEvent(todo);
                const uid = 'todo-' + todo.id + '-' + Date.now() + '@aitodo';
                let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//AI待辦助手//iCalendar 1.0//ZH-TW\r\n';
                ics += 'BEGIN:VEVENT\r\nUID:' + uid + '\r\nSUMMARY:' + (todo.summary || '待辦事項') + '\r\n';
                if (dt.allDay) {
                    ics += 'DTSTART;VALUE=DATE:' + dt.start + '\r\n';
                    const endDate = new Date(dt.start.slice(0,4), parseInt(dt.start.slice(4,6))-1, parseInt(dt.start.slice(6,8)) + 1);
                    const endStr = endDate.getFullYear() + String(endDate.getMonth()+1).padStart(2,'0') + String(endDate.getDate()).padStart(2,'0');
                    ics += 'DTEND;VALUE=DATE:' + endStr + '\r\n';
                } else {
                    ics += 'DTSTART:' + dt.start + '\r\nDTEND:' + dt.end + '\r\n';
                }
                ics += 'DESCRIPTION:由 AI 待辦助手建立\\n' + todo.summary + '\\n分類：' + todo.category + '\r\nEND:VEVENT\r\nEND:VCALENDAR';
                return ics;
            }
            function downloadIcs(filename, content) {
                const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename.endsWith('.ics') ? filename : filename + '.ics';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 1000);
            }
            function exportSingleTodo(todo) {
                try {
                    const ics = buildIcsForTodo(todo);
                    const safeName = todo.summary.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_').substring(0, 30);
                    downloadIcs(safeName + '.ics', ics);
                    setStatus('📅 已匯出「' + todo.summary + '」至行事曆檔案');
                } catch (e) { setStatus('⚠️ 匯出失敗：' + e.message, true); }
            }
            function exportAllTodos() {
                if (!todos.length) { setStatus('⚠️ 沒有待辦事項可匯出', true); return; }
                try {
                    let allIcs = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//AI待辦助手//iCalendar 1.0//ZH-TW\r\n';
                    for (const todo of todos) {
                        const dt = generateIcsEvent(todo);
                        const uid = 'todo-' + todo.id + '-' + Date.now() + '@aitodo';
                        allIcs += 'BEGIN:VEVENT\r\nUID:' + uid + '\r\nSUMMARY:' + (todo.summary || '待辦事項') + '\r\n';
                        if (dt.allDay) {
                            allIcs += 'DTSTART;VALUE=DATE:' + dt.start + '\r\n';
                            const endDate = new Date(dt.start.slice(0,4), parseInt(dt.start.slice(4,6))-1, parseInt(dt.start.slice(6,8)) + 1);
                            const endStr = endDate.getFullYear() + String(endDate.getMonth()+1).padStart(2,'0') + String(endDate.getDate()).padStart(2,'0');
                            allIcs += 'DTEND;VALUE=DATE:' + endStr + '\r\n';
                        } else {
                            allIcs += 'DTSTART:' + dt.start + '\r\nDTEND:' + dt.end + '\r\n';
                        }
                        allIcs += 'DESCRIPTION:由 AI 待辦助手建立\\n' + todo.summary + '\\n分類：' + todo.category + '\r\nEND:VEVENT\r\n';
                    }
                    allIcs += 'END:VCALENDAR';
                    downloadIcs('我的待辦事項.ics', allIcs);
                    setStatus('📅 已匯出全部 ' + todos.length + ' 項待辦至行事曆檔案');
                } catch (e) { setStatus('⚠️ 匯出全部失敗：' + e.message, true); }
            }

            // ---------- 智譜 AI 呼叫 ----------
            async function callZhipuAPI(text) {
                if (!apiKey) throw new Error('尚未設定 API Key');
                const url = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
                const today = new Date().toISOString().split('T')[0];
                const systemPrompt = `你是行政助理，負責從訊息中抽取待辦重點，今天是 ${today}。
用戶可能使用繁體中文或粵語，請正確理解。
規則：
- 日期一律轉成 YYYY-MM-DD；「明天」「聽晚」等相對日期依今天推算。
- 時間一律轉成 24 小時制 HH:mm；訊息沒提到時間就留空字串。
- category 欄位只能填「繳費」「會議」「其他」三選一。
- 找不到的欄位一律回空字串，不要自行編造內容。
- 只回傳 JSON，不要加任何說明文字。
輸出格式固定為：
{"summary":"","category":"","date":"","time":""}`;
                const payload = {
                    model: 'glm-4-flash',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: text }
                    ],
                    temperature: 0.1,
                };
                console.log('🔵 呼叫智譜 AI，輸入:', text);
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const errText = await response.text();
                    console.error('🔴 智譜 API 錯誤:', response.status, errText);
                    throw new Error(`智譜 API 請求失敗 (${response.status}): ${errText}`);
                }
                const data = await response.json();
                console.log('🟢 智譜回應:', data);
                if (!data.choices || !data.choices[0] || !data.choices[0].message) throw new Error('智譜回應格式異常');
                let resultText = data.choices[0].message.content;
                const jsonMatch = resultText.match(/```json\s*([\s\S]*?)\s*```/);
                if (jsonMatch) resultText = jsonMatch[1];
                try { return JSON.parse(resultText); }
                catch (_) { throw new Error('智譜回傳非 JSON 格式: ' + resultText); }
            }

            // ---------- 模擬解析（修正：嚴格星期前綴，避免誤匹配） ----------
            function mockParse(text) {
                console.log('🔧 使用模擬解析（嚴格星期前綴）');
                let summary = text;
                let category = '其他';
                let date = '';
                let time = '';

                if (/繳費|房租|電費|水費|瓦斯|信用卡|帳單|轉帳|匯款|付款/i.test(text)) category = '繳費';
                else if (/會議|開會|報告|簡報|提案|討論/i.test(text)) category = '會議';

                const today = new Date();
                let targetDate = new Date(today);
                let dayOffset = null;
                let weekOffset = null;
                let yearOffset = 0;
                let month = null, day = null;
                let pureYear = null;

                // ---- 匹配「X日後」或「X天後」 ----
                const daysAfterMatch = text.match(/(\d+)\s*[日天]\s*後/);
                if (daysAfterMatch) dayOffset = parseInt(daysAfterMatch[1]);
                const daysBeforeMatch = text.match(/(\d+)\s*[日天]\s*前/);
                if (daysBeforeMatch) dayOffset = -parseInt(daysBeforeMatch[1]);

                // 其他日期詞（優先級高於上述）
                if (/今天|今日/.test(text)) dayOffset = 0;
                else if (/明天|明日|聽日|聽晚/.test(text)) dayOffset = 1;
                else if (/後天|後日/.test(text)) dayOffset = 2;
                else if (/大後天/.test(text)) dayOffset = 3;
                else if (/琴日|昨日/.test(text)) dayOffset = -1;
                else if (/下下星期|下下週/.test(text) && !/(?:星期|禮拜|週)[一二三四五六七日天]/.test(text)) dayOffset = 14;

                // 年份相關
                const yearMatch = text.match(/(\d{4})\s*年/);
                if (yearMatch) pureYear = parseInt(yearMatch[1]);
                const yearAfterMatch = text.match(/(\d+)\s*年\s*後/);
                if (yearAfterMatch) yearOffset = parseInt(yearAfterMatch[1]);
                else if (/明年/.test(text)) yearOffset = 1;
                else if (/後年/.test(text)) yearOffset = 2;

                // 月日
                const monthDayMatch = text.match(/(\d{1,2})[月\-\/](\d{1,2})[日]?/);
                if (monthDayMatch) {
                    month = parseInt(monthDayMatch[1]) - 1;
                    day = parseInt(monthDayMatch[2]);
                }

                // ---- ★ 星期幾解析（嚴格前綴，避免誤匹配「明天」等） ----
                const weekMap = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':7,'天':7 };

                // 先嘗試有上下前綴的
                const weekRegex = /(上|下)(下?)\s*週?\s*(?:星期|禮拜)?\s*([一二三四五六七日天])/;
                const weekMatch = text.match(weekRegex);
                if (weekMatch) {
                    const prefix1 = weekMatch[1];
                    const prefix2 = weekMatch[2];
                    const dayNum = weekMap[weekMatch[3]];
                    if (dayNum) {
                        let currentDay = today.getDay();
                        let targetDay = dayNum % 7;
                        let diff = (targetDay - currentDay + 7) % 7;
                        if (prefix1 === '下') diff += 7;
                        else if (prefix1 === '上') diff -= 7;
                        if (prefix2 === '下') diff += 7;
                        weekOffset = diff;
                    }
                } else {
                    // ★ 無上下前綴但必須有「星期/禮拜/週」前綴，避免誤匹配
                    const simpleWeekRegex = /(?:星期|禮拜|週)\s*([一二三四五六七日天])/;
                    const simpleMatch = text.match(simpleWeekRegex);
                    if (simpleMatch) {
                        const dayNum = weekMap[simpleMatch[1]];
                        if (dayNum) {
                            let currentDay = today.getDay();
                            let targetDay = dayNum % 7;
                            let diff = (targetDay - currentDay + 7) % 7;
                            weekOffset = diff;
                        }
                    }
                }

                // ---- 組合日期 ----
                if (pureYear !== null) {
                    targetDate.setFullYear(pureYear);
                    if (month !== null && day !== null) targetDate.setMonth(month, day);
                } else {
                    if (yearOffset !== 0) targetDate.setFullYear(targetDate.getFullYear() + yearOffset);
                    if (month !== null && day !== null) targetDate.setMonth(month, day);
                    if (weekOffset !== null) {
                        targetDate = new Date(today);
                        targetDate.setDate(today.getDate() + weekOffset);
                        if (yearOffset !== 0) targetDate.setFullYear(targetDate.getFullYear() + yearOffset);
                    } else if (dayOffset !== null) {
                        if (month === null || day === null) {
                            targetDate = new Date(today);
                            targetDate.setDate(today.getDate() + dayOffset);
                            if (yearOffset !== 0) targetDate.setFullYear(targetDate.getFullYear() + yearOffset);
                        }
                    }
                }

                const y = targetDate.getFullYear();
                const m = String(targetDate.getMonth() + 1).padStart(2, '0');
                const d = String(targetDate.getDate()).padStart(2, '0');
                date = y + '-' + m + '-' + d;

                // ---- 時間解析 ----
                function chineseToNum(ch) {
                    const map = { '零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12 };
                    return map[ch] !== undefined ? map[ch] : parseInt(ch);
                }
                const t1 = text.match(/(\d{1,2})[:.](\d{2})/);
                if (t1) {
                    time = String(t1[1]).padStart(2, '0') + ':' + t1[2];
                } else {
                    const pointMatch = text.match(/([一二三四五六七八九十十一十二零\d]+)\s*點\s*(半)?/);
                    if (pointMatch) {
                        let hour = chineseToNum(pointMatch[1]);
                        let minute = 0;
                        if (pointMatch[2] === '半') minute = 30;
                        if (/下午|晚上|夜晚|晚|傍晚/.test(text)) {
                            if (hour < 12) hour += 12;
                        } else if (/凌晨/.test(text) && hour === 12) {
                            hour = 0;
                        } else if (/上午|朝早/.test(text) && hour === 12) {
                            hour = 0;
                        }
                        if (!isNaN(hour) && hour >= 0 && hour <= 23) {
                            time = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
                        }
                    }
                }

                return { summary, category, date, time };
            }

            // ---------- 主要處理流程 ----------
            async function handleAdd() {
                if (isProcessing) return;
                const rawText = todoInput.value.trim();
                if (!rawText) { setStatus('⚠️ 請輸入待辦事項', true); todoInput.focus(); return; }
                setLoading(true);

                const useRealApi = useApi && apiKey;
                if (useRealApi) setStatus('🧠 智譜 AI 解析中...');
                else setStatus('🔧 模擬解析中...');

                try {
                    let parsed, engine = '模擬';
                    if (useRealApi) {
                        try {
                            parsed = await callZhipuAPI(rawText);
                            engine = '智譜 AI';
                        } catch (apiError) {
                            console.error('智譜 API 錯誤，降級為模擬解析:', apiError);
                            setStatus(`⚠️ 智譜 API 失敗：${apiError.message}，改用模擬解析`, true);
                            parsed = mockParse(rawText);
                            engine = '模擬 (API 失敗)';
                        }
                    } else {
                        parsed = mockParse(rawText);
                        engine = '模擬 (未啟用)';
                    }

                    const summary = parsed.summary || rawText;
                    const category = parsed.category || '其他';
                    const date = parsed.date || '';
                    const time = parsed.time || '';

                    addTodo(summary, category, date, time);
                    todoInput.value = '';
                    todoInput.focus();
                    setStatus(`✅ 已新增！(${engine}) 事項：${summary}`);
                } catch (err) {
                    console.error(err);
                    setStatus(`❌ 解析失敗：${err.message}`, true);
                    addTodo(rawText, '其他', '', '');
                    setStatus(`⚠️ 已以原始文字新增，但解析失敗：${err.message}`, true);
                } finally {
                    setLoading(false);
                }
            }

            // ----- 填入範例 -----
            function fillDemo() {
                const demos = [
                    '明天早上10點開會',
                    '後天下午3點看醫生',
                    '星期六晚上9點開會',
                    '下星期日開會',
                    '5日後晚11點開會',
                    '聽晚9點開會',
                    '下週三下午三點開會',
                    '今日下午五點前繳交信用卡費',
                    '10月6日下午3點開會',
                    '2028年10月6日下午十點都更開會',
                ];
                const pick = demos[Math.floor(Math.random() * demos.length)];
                todoInput.value = pick;
                todoInput.focus();
                setStatus(`📝 已填入範例：「${pick}」`);
            }

            // ----- API 與分類設定管理 -----
            function initConfig() {
                loadCategories();
                renderCatList();
                const loaded = loadFromLocal();
                if (!loaded) { todos = []; nextId = 1; saveToLocal(); }
                apiKeyInput.value = apiKey;
                updateApiHint();
                if (apiKey) useApi = true;
                console.log('🔑 API Key:', apiKey ? '已設定' : '無');
                console.log('🧠 useApi:', useApi);
            }

            function updateApiHint() {
                if (useApi && apiKey) {
                    apiHint.innerHTML = `🧠 目前使用 <strong>智譜 AI</strong>（金鑰已設定）。點擊「<a href="#" id="toggleApiConfig">顯示進階設定</a>」可管理金鑰。`;
                } else {
                    apiHint.innerHTML = `⚙️ 目前使用 <strong>模擬解析</strong>（無 API 金鑰）。若要啟用智譜 AI，請點擊「<a href="#" id="toggleApiConfig">顯示進階設定</a>」填入金鑰。`;
                }
                const link = document.getElementById('toggleApiConfig');
                if (link) {
                    link.removeEventListener('click', toggleConfigHandler);
                    link.addEventListener('click', toggleConfigHandler);
                }
            }

            function toggleConfigHandler(e) {
                e.preventDefault();
                const isHidden = apiConfig.style.display === 'none';
                apiConfig.style.display = isHidden ? 'block' : 'none';
                if (isHidden) { apiKeyInput.focus(); apiKeyInput.select(); setStatus('✏️ 請貼上或輸入新的 API Key，然後點擊「儲存」'); }
            }

            function saveApiKey() {
                const key = apiKeyInput.value.trim();
                if (!key) { setStatus('⚠️ 請先貼上 API Key', true); return; }
                apiKey = key; useApi = true; saveToLocal(); updateApiHint(); apiConfig.style.display = 'none';
                setStatus('✅ 智譜 AI API Key 已儲存（本地）');
                console.log('🔑 已儲存新金鑰');
            }

            function clearApiKey() {
                apiKey = ''; useApi = false; apiKeyInput.value = ''; saveToLocal(); updateApiHint();
                setStatus('🧹 已清除 API Key，切換為模擬模式');
                console.log('🧹 已清除金鑰');
            }

            function togglePwdVisibility() {
                if (apiKeyInput.type === 'password') {
                    apiKeyInput.type = 'text';
                    togglePwdBtn.textContent = '🙈';
                } else {
                    apiKeyInput.type = 'password';
                    togglePwdBtn.textContent = '👁️';
                }
            }

            function toggleCatPanel() {
                const isHidden = catPanel.style.display === 'none';
                catPanel.style.display = isHidden ? 'block' : 'none';
                if (isHidden) newCatInput.focus();
            }

            function addCategory() {
                const name = newCatInput.value.trim();
                if (!name) { setStatus('⚠️ 請輸入分類名稱', true); return; }
                if (categories.includes(name)) { setStatus('⚠️ 分類已存在', true); return; }
                categories.push(name);
                saveCategories();
                renderCatList();
                newCatInput.value = '';
                render();
                setStatus(`✅ 已新增分類「${name}」`);
            }

            // ----- 事件綁定 -----
            addBtn.addEventListener('click', handleAdd);
            todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); handleAdd(); } });
            clearBtn.addEventListener('click', clearAll);
            demoBtn.addEventListener('click', fillDemo);
            exportAllBtn.addEventListener('click', exportAllTodos);
            manageCatBtn.addEventListener('click', toggleCatPanel);
            addCatBtn.addEventListener('click', addCategory);
            newCatInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCategory(); } });
            saveApiKeyBtn.addEventListener('click', saveApiKey);
            clearApiKeyBtn.addEventListener('click', clearApiKey);
            togglePwdBtn.addEventListener('click', togglePwdVisibility);
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    if (apiConfig.style.display === 'block') apiConfig.style.display = 'none';
                    if (catPanel.style.display === 'block') catPanel.style.display = 'none';
                }
            });

            // ----- 啟動 -----
            initConfig();

            if (todos.length === 0) {
                addTodo('明天早上10點開會', '會議', '', '');
                addTodo('後天下午3點看醫生', '會議', '', '');
                setStatus('👋 歡迎！已為你建立「明天」和「後天」的範例');
            } else {
                render();
                setStatus(`📂 已載入 ${todos.length} 項待辦`);
            }
            todoInput.focus();
        })();
    </script>
</body>
