<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 待辦助手 (智譜 AI + 雲端同步)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', 'PingFang TC', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { max-width: 720px; width: 100%; background: #ffffff; border-radius: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); padding: 32px 28px; }
        h1 { font-size: 26px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        h1 small { font-size: 14px; font-weight: 400; color: #94a3b8; margin-left: auto; }
        .subtitle { color: #64748b; font-size: 15px; border-left: 4px solid #818cf8; padding-left: 14px; margin-bottom: 28px; line-height: 1.5; }
        .input-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
        .input-row { display: flex; gap: 12px; }
        .input-row input { flex: 1; padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 16px; outline: none; transition: border 0.2s, box-shadow 0.2s; background: #f8fafc; }
        .input-row input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(129,140,248,0.15); background: #ffffff; }
        .input-row input::placeholder { color: #94a3b8; }
        .btn { padding: 14px 28px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .btn-primary { background: #818cf8; color: #fff; }
        .btn-primary:hover { background: #6366f1; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(129,140,248,0.35); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-success { background: #a7f3d0; color: #065f46; }
        .btn-success:hover { background: #6ee7b7; }
        .btn-danger { background: #fecaca; color: #b91c1c; }
        .btn-danger:hover { background: #fca5a5; }
        .btn-edit { background: #fef08a; color: #854d0e; }
        .btn-edit:hover { background: #fde047; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .status-bar { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #64748b; min-height: 28px; flex-wrap: wrap; }
        .status-bar .spinner { display: none; width: 20px; height: 20px; border: 3px solid #e2e8f0; border-top: 3px solid #818cf8; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .status-bar .spinner.active { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .todo-list { margin-top: 16px; border-radius: 16px; overflow: hidden; border: 1px solid #eef2f6; }
        .todo-header { display: grid; grid-template-columns: 3fr 1.2fr 1.2fr 1fr 0.8fr 0.5fr 0.5fr; background: #f1f4f9; padding: 12px 16px; font-weight: 600; font-size: 13px; color: #475569; letter-spacing: 0.3px; border-bottom: 1px solid #e2e8f0; }
        .todo-item { display: grid; grid-template-columns: 3fr 1.2fr 1.2fr 1fr 0.8fr 0.5fr 0.5fr; padding: 14px 16px; background: #ffffff; border-bottom: 1px solid #f1f5f9; align-items: center; font-size: 15px; transition: background 0.15s; gap: 4px; }
        .todo-item:last-child { border-bottom: none; }
        .todo-item:hover { background: #fafbff; }
        .todo-item .summary { font-weight: 500; color: #0f172a; word-break: break-word; }
        .todo-item .category { font-size: 13px; background: #eef2ff; color: #4338ca; padding: 4px 12px; border-radius: 20px; display: inline-block; width: fit-content; }
        .todo-item .date, .todo-item .time { color: #334155; font-feature-settings: "tnum"; }
        .todo-item .cal-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 6px; border-radius: 8px; transition: background 0.2s; color: #0ea5e9; justify-self: center; }
        .todo-item .cal-btn:hover { background: #e0f2fe; }
        .todo-item .edit-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 6px; border-radius: 8px; transition: background 0.2s; color: #eab308; justify-self: center; }
        .todo-item .edit-btn:hover { background: #fef9c3; }
        .todo-item .delete-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; transition: color 0.2s; padding: 4px 6px; border-radius: 8px; justify-self: end; }
        .todo-item .delete-btn:hover { color: #ef4444; background: #fef2f2; }
        .todo-item .edit-input { width: 100%; padding: 4px 8px; border: 2px solid #818cf8; border-radius: 8px; font-size: 14px; background: #f8fafc; }
        .todo-item .edit-select { width: 100%; padding: 4px 8px; border: 2px solid #818cf8; border-radius: 8px; font-size: 14px; background: #f8fafc; }
        .todo-item .edit-date, .todo-item .edit-time { width: 100%; padding: 4px 8px; border: 2px solid #818cf8; border-radius: 8px; font-size: 14px; background: #f8fafc; }
        .todo-item .edit-btns { display: flex; gap: 6px; justify-content: center; }
        .todo-item .edit-btns button { padding: 4px 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .todo-item .edit-btns .save-btn { background: #a7f3d0; color: #065f46; }
        .todo-item .edit-btns .save-btn:hover { background: #6ee7b7; }
        .todo-item .edit-btns .cancel-btn { background: #fecaca; color: #b91c1c; }
        .todo-item .edit-btns .cancel-btn:hover { background: #fca5a5; }
        .todo-divider { background: #f1f5f9; padding: 8px 16px; font-weight: 600; color: #475569; border-bottom: 1px solid #e2e8f0; }
        .todo-divider.overdue { color: #b91c1c; background: #fef2f2; }
        .todo-item.overdue { opacity: 0.6; font-style: italic; color: #64748b; }
        .todo-item.overdue .summary { color: #64748b; }
        .todo-item.overdue .category { opacity: 0.7; }
        .empty-state { padding: 48px 20px; text-align: center; color: #94a3b8; font-size: 15px; }
        .empty-state span { font-size: 40px; display: block; margin-bottom: 12px; }
        .footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; flex-wrap: wrap; gap: 10px; }
        .count-badge { font-size: 14px; color: #64748b; }
        .count-badge strong { color: #1e293b; }
        .api-hint, .cat-hint { font-size: 13px; color: #94a3b8; margin-top: 14px; padding: 14px 18px; background: #f8fafc; border-radius: 12px; border: 1px dashed #d1d5db; line-height: 1.7; }
        .api-hint a, .cat-hint a { color: #6366f1; text-decoration: none; }
        .api-hint a:hover, .cat-hint a:hover { text-decoration: underline; }
        .api-config-row, .cat-config-row, .sync-config-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .api-config-row input[type="text"], .cat-config-row input[type="text"], .sync-config-row input[type="text"] { flex: 1; padding: 10px 14px; border: 2px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none; min-width: 150px; background: #ffffff; }
        .api-config-row input[type="text"]:focus, .cat-config-row input[type="text"]:focus, .sync-config-row input[type="text"]:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,0.2); }
        .toggle-pwd-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px 10px; border-radius: 8px; color: #64748b; transition: background 0.2s; }
        .toggle-pwd-btn:hover { background: #e2e8f0; }
        .sync-checkbox { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #475569; }
        .sync-status { font-size: 13px; color: #64748b; margin-top: 6px; }
        .cat-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .cat-tag { display: inline-flex; align-items: center; gap: 6px; background: #eef2ff; padding: 4px 12px 4px 16px; border-radius: 20px; font-size: 14px; color: #4338ca; }
        .cat-tag .del-cat { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; padding: 0 4px; }
        .cat-tag .del-cat:hover { color: #ef4444; }
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .input-row { flex-direction: column; }
            .todo-header { display: none; }
            .todo-item { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 16px; border-bottom: 1px solid #f1f5f9; }
            .todo-item .summary { width: 100%; font-size: 16px; margin-bottom: 4px; }
            .todo-item .category { font-size: 12px; }
            .todo-item .date, .todo-item .time { font-size: 14px; }
            .todo-item .cal-btn, .todo-item .edit-btn { margin-left: auto; font-size: 20px; }
            .todo-item .delete-btn { margin-left: 0; }
            .footer-actions { flex-direction: column; align-items: stretch; }
            .api-config-row, .cat-config-row, .sync-config-row { flex-direction: column; align-items: stretch; }
            .todo-item .edit-btns { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ 待辦助手 <small>智譜 AI + 雲端</small></h1>
        <div class="subtitle">輸入一句話，AI 自動拆解成 事項 · 分類 · 日期 · 時間 <span style="color:#ef4444;font-size:13px;">🔔 開始前5分鐘提醒</span></div>

        <div class="input-area">
            <div class="input-row">
                <input type="text" id="todoInput" placeholder="例如：明天早上10點開會" autofocus />
                <button class="btn btn-primary" id="addBtn">➕ 新增</button>
            </div>
            <div class="status-bar">
                <span class="spinner" id="spinner"></span>
                <span id="statusMsg">💡 輸入待辦事項，AI 會自動判讀</span>
            </div>
        </div>

        <div class="todo-list">
            <div class="todo-header">
                <span>事項</span><span>分類</span><span>日期</span><span>時間</span>
                <span style="text-align:center;">📅</span>
                <span style="text-align:center;">✏️</span>
                <span></span>
            </div>
            <div id="todoItems">
                <div class="empty-state"><span>📋</span>還沒有待辦事項<br /><span style="font-size:14px;color:#cbd5e1;">試試在上方輸入一句話</span></div>
            </div>
        </div>

        <!-- 下方操作按鈕區（在此加入了適當的匯出按鈕） -->
        <div class="footer-actions">
            <span class="count-badge" id="countBadge">共 <strong id="todoCount">0</strong> 項</span>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-success" id="exportCsvBtn">📊 匯出 CSV</button>
                <button class="btn btn-success" id="exportIcsBtn">📅 匯出 ICS</button>
                <button class="btn btn-secondary" id="clearBtn">🗑️ 清空全部</button>
                <button class="btn btn-secondary" id="demoBtn">🧪 填入範例</button>
                <button class="btn btn-secondary" id="manageCatBtn">📂 管理分類</button>
            </div>
        </div>

        <div id="catPanel" style="display:none;margin-top:14px;padding:18px 20px;background:#f1f5f9;border-radius:14px;">
            <div style="font-weight:600;font-size:14px;color:#1e293b;margin-bottom:8px;">📂 管理分類</div>
            <div class="cat-config-row">
                <input type="text" id="newCatInput" placeholder="輸入新分類名稱" />
                <button class="btn btn-primary btn-sm" id="addCatBtn">➕ 新增</button>
            </div>
            <div class="cat-list" id="catList"></div>
            <div style="font-size:12px;color:#64748b;margin-top:8px;">💡 刪除分類不會影響已使用該分類的待辦事項，僅從下拉選單中移除。</div>
        </div>

        <div class="api-hint" id="apiHint">
            🧠 目前使用 <strong>智譜 AI</strong>（金鑰已自動載入）。
            點擊「<a href="#" id="toggleApiConfig">顯示進階設定</a>」可管理金鑰及雲端同步。
        </div>
        <div id="apiConfig" style="display:none;margin-top:14px;padding:18px 20px;background:#f1f5f9;border-radius:14px;">
            <label style="font-weight:600;font-size:14px;color:#1e293b;display:block;margin-bottom:8px;">🔑 智譜 AI API Key</label>
            <div class="api-config-row">
                <input type="text" id="apiKeyInput" placeholder="貼上你的智譜 API Key" />
                <button class="toggle-pwd-btn" id="togglePwdBtn" title="顯示/隱藏金鑰">👁️</button>
                <button class="btn btn-primary" id="saveApiKeyBtn" style="padding:10px 20px;font-size:14px;">💾 儲存</button>
                <button class="btn btn-secondary" id="clearApiKeyBtn" style="padding:10px 20px;font-size:14px;">清除</button>
            </div>
            <div style="font-size:13px;color:#64748b;margin-top:8px;margin-bottom:16px;">
                可至 <a href="https://open.bigmodel.cn/" target="_blank" style="color:#6366f1;">智譜AI開放平台</a> 取得金鑰。
            </div>

            <hr style="border:1px dashed #d1d5db;margin:12px 0;" />
            <label style="font-weight:600;font-size:14px;color:#1e293b;display:block;margin-bottom:8px;">☁️ 雲端同步 (JSONBin.io)</label>
            <div class="sync-config-row">
                <input type="text" id="syncApiKeyInput" placeholder="JSONBin API Key" style="flex:1;min-width:120px;" />
                <input type="text" id="syncBinIdInput" placeholder="Bin ID" style="flex:1;min-width:120px;" />
                <div class="sync-checkbox">
                    <input type="checkbox" id="syncEnabled" />
                    <label for="syncEnabled">啟用同步</label>
                </div>
                <button class="btn btn-primary btn-sm" id="saveSyncBtn">💾 儲存設定</button>
                <button class="btn btn-secondary btn-sm" id="syncNowBtn">🔄 欄位同步</button>
            </div>
            <div class="sync-status" id="syncStatus">尚未設定同步</div>
            <div style="font-size:12px;color:#64748b;margin-top:6px;">
                請至 <a href="https://jsonbin.io/" target="_blank" style="color:#6366f1;">JSONBin.io</a> 註冊並建立 Bin。
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const APP_VERSION = '3.6';

            let todos = [];
            let nextId = 1;
            let isProcessing = false;
            let useApi = true;
            let apiKey = '';
            let editingId = null;
            let categories = [];

            let syncEnabled = false;
            let syncApiKey = '';
            let syncBinId = '';
            let isSyncing = false;

            const todoInput = document.getElementById('todoInput');
            const addBtn = document.getElementById('addBtn');
            const todoItems = document.getElementById('todoItems');
            const todoCount = document.getElementById('todoCount');
            const countBadge = document.getElementById('countBadge');
            const statusMsg = document.getElementById('statusMsg');
            const spinner = document.getElementById('spinner');
            const clearBtn = document.getElementById('clearBtn');
            const demoBtn = document.getElementById('demoBtn');
            const exportCsvBtn = document.getElementById('exportCsvBtn');
            const exportIcsBtn = document.getElementById('exportIcsBtn');
            const manageCatBtn = document.getElementById('manageCatBtn');
            const catPanel = document.getElementById('catPanel');
            const newCatInput = document.getElementById('newCatInput');
            const addCatBtn = document.getElementById('addCatBtn');
            const catList = document.getElementById('catList');

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
            }

            function setStatus(msg, isError = false) {
                statusMsg.textContent = msg;
                statusMsg.style.color = isError ? '#b91c1c' : '#64748b';
            }

            function isOverdue(todo) {
                if (!todo.date) return false;
                const parts = todo.date.split('-');
                if (parts.length !== 3) return false;
                let targetDate;
                if (todo.time) {
                    const timeParts = todo.time.split(':');
                    if (timeParts.length !== 2) return false;
                    targetDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]), parseInt(timeParts[0]), parseInt(timeParts[1]), 0);
                } else {
                    const now = new Date();
                    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const target = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
                    return target < today;
                }
                if (isNaN(targetDate.getTime())) return false;
                return targetDate < new Date();
            }

            function render() {
                todoItems.innerHTML = '';
                if (todos.length === 0) {
                    todoItems.innerHTML = `<div class="empty-state"><span>📋</span>還沒有待辦事項<br /><span style="font-size:14px;color:#cbd5e1;">試試在上方輸入一句話</span></div>`;
                    todoCount.textContent = '0';
                    countBadge.innerHTML = `共 <strong id="todoCount">0</strong> 項`;
                    return;
                }

                const overdue = [];
                const upcoming = [];
                todos.forEach(t => {
                    if (isOverdue(t)) overdue.push(t);
                    else upcoming.push(t);
                });

                upcoming.sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
                
                const total = todos.length;
                todoCount.textContent = total;
                countBadge.innerHTML = `共 <strong>${total}</strong> 項`;

                todos.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'todo-item' + (isOverdue(item) ? ' overdue' : '');
                    div.innerHTML = `
                        <span class="summary">${escapeHtml(item.summary)}</span>
                        <span class="category">${escapeHtml(item.category || '其他')}</span>
                        <span class="date">${item.date || '-'}</span>
                        <span class="time">${item.time || '-'}</span>
                        <button class="cal-btn" title="匯出日曆檔">📅</button>
                        <button class="edit-btn">✏️</button>
                        <button class="delete-btn">🗑️</button>
                    `;
                    
                    div.querySelector('.delete-btn').addEventListener('click', () => {
                        todos = todos.filter(t => t.id !== item.id);
                        render();
                    });
                    
                    div.querySelector('.cal-btn').addEventListener('click', () => exportSingleIcs(item));

                    todoItems.appendChild(div);
                });
            }

            // ===== 匯出功能邏輯 ===== //
            
            // 1. 匯出 CSV (支援 Excel 不亂碼)
            function exportToCsv() {
                if (todos.length === 0) {
                    alert('目前沒有任何待辦事項可匯出！');
                    return;
                }
                
                let csvContent = "\uFEFF"; // 加入 UTF-8 BOM，防止 Excel 開啟時中文亂碼
                csvContent += "事項,分類,日期,時間\n";

                todos.forEach(todo => {
                    const summary = `"${(todo.summary || '').replace(/"/g, '""')}"`;
                    const category = `"${(todo.category || '其他').replace(/"/g, '""')}"`;
                    const date = `"${todo.date || ''}"`;
                    const time = `"${todo.time || ''}"`;
                    csvContent += `${summary},${category},${date},${time}\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.setAttribute('download', `待辦事項_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // 2. 生成 ICS 日曆文字
            function generateIcsString(todoList) {
                let ics = [
                    'BEGIN:VCALENDAR',
                    'VERSION:2.0',
                    'PRODID:-//AI Todo Assistant//EN'
                ];

                todoList.forEach(item => {
                    if (!item.date) return;
                    
                    const cleanDate = item.date.replace(/-/g, '');
                    let dtStart = cleanDate;
                    let dtEnd = cleanDate;

                    if (item.time) {
                        const cleanTime = item.time.replace(/:/g, '') + '00';
                        dtStart += 'T' + cleanTime;
                        // 預設事件時長 30 分鐘
                        const [hh, mm] = item.time.split(':').map(Number);
                        const endDate = new Date(1970, 0, 1, hh, mm + 30);
                        const endH = String(endDate.getHours()).padStart(2, '0');
                        const endM = String(endDate.getMinutes()).padStart(2, '0');
                        dtEnd += 'T' + endH + endM + '00';
                    }

                    ics.push(
                        'BEGIN:VEVENT',
                        `SUMMARY:${item.summary}`,
                        `DESCRIPTION:分類: ${item.category || '其他'}`,
                        item.time ? `DTSTART:${dtStart}` : `DTSTART;VALUE=DATE:${dtStart}`,
                        item.time ? `DTEND:${dtEnd}` : `DTEND;VALUE=DATE:${dtEnd}`,
                        'BEGIN:VALARM',
                        'TRIGGER:-PT5M', // 開始前 5 分鐘提醒
                        'ACTION:DISPLAY',
                        'DESCRIPTION:Reminder',
                        'END:VALARM',
                        'END:VEVENT'
                    );
                });

                ics.push('END:VCALENDAR');
                return ics.join('\r\n');
            }

            // 匯出全部為 ICS 檔
            function exportAllIcs() {
                const validTodos = todos.filter(t => t.date);
                if (validTodos.length === 0) {
                    alert('沒有包含「日期」的待辦事項可匯出至日曆！');
                    return;
                }
                const icsData = generateIcsString(validTodos);
                downloadFile(icsData, `所有待辦事項_${new Date().toISOString().slice(0,10)}.ics`, 'text/calendar');
            }

            // 單一匯出 ICS 檔
            function exportSingleIcs(todo) {
                if (!todo.date) {
                    alert('此事項無日期，無法匯出至日曆！');
                    return;
                }
                const icsData = generateIcsString([todo]);
                downloadFile(icsData, `${todo.summary}.ics`, 'text/calendar');
            }

            // 通用檔案下載
            function downloadFile(content, fileName, mimeType) {
                const blob = new Blob([content], { type: mimeType + ';charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.setAttribute('download', fileName);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // 事件監聽綁定
            exportCsvBtn.addEventListener('click', exportToCsv);
            exportIcsBtn.addEventListener('click', exportAllIcs);

            // 測試範例
            demoBtn.addEventListener('click', () => {
                todos = [
                    { id: 1, summary: '團隊每週例會', category: '會議', date: '2026-03-20', time: '10:00' },
                    { id: 2, summary: '繳交本月水電費', category: '繳費', date: '2026-03-25', time: '18:00' }
                ];
                render();
            });

            clearBtn.addEventListener('click', () => {
                if (confirm('確定要清空所有待辦事項嗎？')) {
                    todos = [];
                    render();
                }
            });

            render();
        })();
    </script>
